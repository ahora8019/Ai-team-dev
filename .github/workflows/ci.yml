name: CI

on:
  push:
    branches: ["feat/agent-workspace-bootstrap"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile coordinator
        run: python -m py_compile team.py tests/test_team.py
      - name: Run smoke tests
        run: python -m unittest discover -s tests -v
